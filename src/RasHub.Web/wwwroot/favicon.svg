<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RasHub">
    <defs>
        <radialGradient id="core" cx="38%" cy="32%" r="68%">
            <stop offset="0" stop-color="#dbeafe"/>
            <stop offset=".38" stop-color="#7db5ff"/>
            <stop offset="1" stop-color="#315fba"/>
        </radialGradient>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="2.2" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <circle cx="32" cy="32" r="10" fill="url(#core)" filter="url(#glow)"/>
    <g fill="none" stroke="#76a9ef" stroke-width="2.2" opacity=".9">
        <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(12 32 32)"/>
        <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(72 32 32)"/>
        <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(132 32 32)"/>
    </g>
    <g fill="#b9d7ff" filter="url(#glow)">
        <circle cx="55.4" cy="37" r="2.8"/>
        <circle cx="36.8" cy="7.3" r="2.8"/>
        <circle cx="9.6" cy="41.6" r="2.8"/>
    </g>
</svg>
