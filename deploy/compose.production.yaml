name: rashub

services:
  seq:
    image: datalust/seq:2026.1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_API_CANONICALURI: ${SEQ_PUBLIC_URL:?SEQ_PUBLIC_URL is required}
      SEQ_FIRSTRUN_ADMINUSERNAME: ${SEQ_ADMIN_USERNAME:-admin}
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH:?SEQ_ADMIN_PASSWORD_HASH is required}
    volumes:
      - seq-production:/data
    ports:
      - "${SEQ_BIND_ADDRESS:-127.0.0.1}:${SEQ_PORT:-5341}:80"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rashub}
      POSTGRES_USER: ${POSTGRES_USER:-rashub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-production:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ${RASHUB_IMAGE:-rashub:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    command:
      - --mode=migrate
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RasHub: Host=postgres;Port=5432;Database=${POSTGRES_DB:-rashub};Username=${POSTGRES_USER:-rashub};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Database__ApplyMigrations: "false"
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  rashub:
    image: ${RASHUB_IMAGE:-rashub:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__RasHub: Host=postgres;Port=5432;Database=${POSTGRES_DB:-rashub};Username=${POSTGRES_USER:-rashub};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Database__ApplyMigrations: "false"
      Authorization__BootstrapAdminEmail: ${RASHUB_BOOTSTRAP_ADMIN_EMAIL:?RASHUB_BOOTSTRAP_ADMIN_EMAIL is required}
      Authorization__BootstrapAdminPasswordFile: /run/secrets/rashub-bootstrap-admin-password
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
      DataProtection__CertificatePath: /run/secrets/rashub-data-protection-certificate
      DataProtection__CertificatePasswordFile: /run/secrets/rashub-data-protection-certificate-password
      ReverseProxy__KnownProxies__0: ${RASHUB_TRUSTED_PROXY:-127.0.0.1}
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
      OpenTelemetry__MetricsEndpoint: ${RASHUB_OTLP_METRICS_ENDPOINT:-http://seq:5341/ingest/otlp/v1/metrics}
    volumes:
      - data-protection-production:/home/app/.aspnet/DataProtection-Keys
    secrets:
      - rashub-bootstrap-admin-password
      - rashub-data-protection-certificate
      - rashub-data-protection-certificate-password
    ports:
      - "${RASHUB_BIND_ADDRESS:-127.0.0.1}:${RASHUB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seq:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  data-protection-production:
  postgres-production:
  seq-production:

secrets:
  rashub-bootstrap-admin-password:
    file: ${RASHUB_BOOTSTRAP_ADMIN_PASSWORD_FILE:?RASHUB_BOOTSTRAP_ADMIN_PASSWORD_FILE is required}
  rashub-data-protection-certificate:
    file: ${RASHUB_DATA_PROTECTION_CERTIFICATE_PATH:?RASHUB_DATA_PROTECTION_CERTIFICATE_PATH is required}
  rashub-data-protection-certificate-password:
    file: ${RASHUB_DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE:?RASHUB_DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE is required}
