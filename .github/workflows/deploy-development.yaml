name: Deploy development

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string

concurrency:
  group: rashub-development
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rasecosystem/ras-hub

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - rashub-dev
    environment: development

    env:
      REVISION: ${{ inputs.revision }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Validate revision
        shell: bash
        run: |
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid revision: $REVISION" >&2
            exit 2
          fi

      - name: Deploy image
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" |
            sudo /usr/local/sbin/rashub-dev-deploy \
              "$REGISTRY/$IMAGE_NAME:dev-$REVISION" \
              "${{ github.actor }}"
