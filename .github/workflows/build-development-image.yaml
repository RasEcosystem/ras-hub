name: Build development image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rasecosystem/ras-hub

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore RasHub.sln

      - name: Verify formatting
        run: dotnet format RasHub.sln --no-restore --verify-no-changes

      - name: Build
        run: >-
          dotnet build RasHub.sln
          --configuration Release
          --no-restore
          --warnaserror
          -m:1

      - name: Test
        run: >-
          dotnet test RasHub.sln
          --configuration Release
          --no-build
          --no-restore
          -m:1

  build:
    needs:
      - verify
    runs-on: ubuntu-latest
    concurrency:
      group: build-development
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs:
      - build
    concurrency:
      group: rashub-development
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - Linux
      - X64
      - rashub-dev
    environment: development

    env:
      REVISION: ${{ github.sha }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Deploy image
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" |
            sudo /usr/local/sbin/rashub-dev-deploy \
              "$REGISTRY/$IMAGE_NAME:dev-$REVISION" \
              "${{ github.actor }}"
